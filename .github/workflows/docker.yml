name: Noctemblith image (manual GHCR build)

# This fork deliberately does NOT publish to misskey/misskey on Docker Hub.
# Only an operator-triggered workflow targeting a Noctemblith release branch
# can publish a commit-addressed image to this organization's GHCR namespace.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Noctemblith (linux/amd64)
    if: startsWith(github.ref, 'refs/heads/noctemblith/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable revision tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NOCTEMBLITH_BUILD_SHA=${{ github.sha }}
            NOCTEMBLITH_UPDATE_CHANNEL=${{ github.ref_name }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/eventide-manafield/noctemblith:build-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish digest in workflow summary
        run: |
          printf 'Image: `ghcr.io/eventide-manafield/noctemblith:build-%s`\n\nDigest: `%s`\n' \
            "${GITHUB_SHA}" "${{ steps.image.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
