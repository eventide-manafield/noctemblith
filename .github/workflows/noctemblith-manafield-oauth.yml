name: Noctemblith Manafield OAuth foundation
on:
  pull_request:
    paths:
      - "packages/backend/src/server/manafield-oauth/**"
      - "test/unit/noctemblith-manafield-oauth-node.test.mjs"
      - ".github/workflows/noctemblith-manafield-oauth.yml"
permissions:
  contents: read
jobs:
  oauth-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OAuth helper smoke tests
        run: node --experimental-strip-types --test test/unit/noctemblith-manafield-oauth-node.test.mjs
