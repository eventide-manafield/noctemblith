<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1254" height="1254" viewBox="0 0 1254 1254" fill="none"
     role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Noctemblith — 녹템블리스 · 그믐석</title>
  <desc id="logo-desc">A faceted violet crescent crystal with three layers of sunset light enclosed inside its lower point.</desc>
  <defs>
    <!-- Every visible facet is a real vector path; no raster image is embedded. -->
    <linearGradient id="cap-front" x1="616" y1="143" x2="825" y2="443" gradientUnits="userSpaceOnUse">
      <stop stop-color="#722295"/>
      <stop offset=".50" stop-color="#8327a6"/>
      <stop offset="1" stop-color="#b343bf"/>
    </linearGradient>
    <linearGradient id="cap-top" x1="665" y1="127" x2="900" y2="379" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6b1ec"/>
      <stop offset=".12" stop-color="#d66be4"/>
      <stop offset=".64" stop-color="#b23cec"/>
      <stop offset="1" stop-color="#ad45e0"/>
    </linearGradient>
    <linearGradient id="cap-end" x1="835" y1="346" x2="811" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b37c1"/>
      <stop offset=".68" stop-color="#b34bc4"/>
      <stop offset="1" stop-color="#8b2ea1"/>
    </linearGradient>
    <linearGradient id="spine-front" x1="858" y1="369" x2="812" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b451cc"/>
      <stop offset=".24" stop-color="#9939b8"/>
      <stop offset=".7" stop-color="#922ba8"/>
      <stop offset="1" stop-color="#9b35b5"/>
    </linearGradient>
    <linearGradient id="spine-edge" x1="1014" y1="330" x2="874" y2="795" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9e3dcb"/>
      <stop offset=".23" stop-color="#7b21ac"/>
      <stop offset=".78" stop-color="#5d1b86"/>
      <stop offset="1" stop-color="#702393"/>
    </linearGradient>
    <linearGradient id="spine-seam" x1="818" y1="471" x2="955" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#51135f"/>
      <stop offset=".6" stop-color="#2d0c45"/>
      <stop offset="1" stop-color="#7f2b96"/>
    </linearGradient>
    <linearGradient id="left-top" x1="359" y1="703" x2="526" y2="828" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6a208d"/>
      <stop offset=".5" stop-color="#8c2baf"/>
      <stop offset="1" stop-color="#b849c1"/>
    </linearGradient>
    <linearGradient id="left-cut" x1="434" y1="708" x2="596" y2="813" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c45bdc"/>
      <stop offset=".14" stop-color="#a138c4"/>
      <stop offset="1" stop-color="#8d2ca6"/>
    </linearGradient>
    <linearGradient id="right-top" x1="785" y1="703" x2="882" y2="838" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d064eb"/>
      <stop offset=".24" stop-color="#a33dca"/>
      <stop offset=".92" stop-color="#9430b3"/>
    </linearGradient>
    <linearGradient id="right-cut" x1="785" y1="698" x2="738" y2="817" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a29a8"/>
      <stop offset="1" stop-color="#6d2189"/>
    </linearGradient>
    <linearGradient id="base-left" x1="396" y1="820" x2="619" y2="1104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8031ad"/>
      <stop offset=".27" stop-color="#8631ae"/>
      <stop offset=".65" stop-color="#8f32ae"/>
      <stop offset="1" stop-color="#682083"/>
    </linearGradient>
    <linearGradient id="base-right" x1="885" y1="829" x2="621" y2="1110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#682183"/>
      <stop offset=".56" stop-color="#9a35b1"/>
      <stop offset="1" stop-color="#8931a8"/>
    </linearGradient>
    <linearGradient id="base-tip" x1="620" y1="1063" x2="620" y2="1104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9e41c2" stop-opacity="0"/>
      <stop offset="1" stop-color="#b24ccb" stop-opacity=".36"/>
    </linearGradient>

    <linearGradient id="amber-broad" x1="620" y1="798" x2="620" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5a151" stop-opacity="0"/>
      <stop offset=".22" stop-color="#ff9f48" stop-opacity=".45"/>
      <stop offset=".44" stop-color="#ffbc63" stop-opacity=".96"/>
      <stop offset=".60" stop-color="#ff9b53" stop-opacity=".93"/>
      <stop offset=".78" stop-color="#f37973" stop-opacity=".69"/>
      <stop offset="1" stop-color="#eb718d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber-mid" x1="620" y1="890" x2="620" y2="961" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb9a5e" stop-opacity="0"/>
      <stop offset=".22" stop-color="#f89061" stop-opacity=".54"/>
      <stop offset=".42" stop-color="#ffc175" stop-opacity=".99"/>
      <stop offset=".61" stop-color="#ffab65" stop-opacity=".94"/>
      <stop offset=".84" stop-color="#f27b7e" stop-opacity=".60"/>
      <stop offset="1" stop-color="#ee6689" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber-bottom" x1="620" y1="971" x2="620" y2="1045" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8e69" stop-opacity="0"/>
      <stop offset=".22" stop-color="#ff9b68" stop-opacity=".45"/>
      <stop offset=".43" stop-color="#ffd18e" stop-opacity=".94"/>
      <stop offset=".61" stop-color="#ffab6a" stop-opacity=".9"/>
      <stop offset=".81" stop-color="#df6790" stop-opacity=".6"/>
      <stop offset="1" stop-color="#b448a7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunset-highlight" x1="260" y1="0" x2="987" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9a3d" stop-opacity=".76"/>
      <stop offset=".18" stop-color="#ffd279"/>
      <stop offset=".46" stop-color="#ffe6a1"/>
      <stop offset=".68" stop-color="#ffd283"/>
      <stop offset="1" stop-color="#ff9443" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="center-ridge" x1="610" y1="0" x2="627" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4d2fd" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff6f8" stop-opacity=".78"/>
      <stop offset=".85" stop-color="#eeafe1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d07eca" stop-opacity="0"/>
    </linearGradient>
    <!-- Fade band tips into the crystal instead of hard rectangular end caps. -->
    <linearGradient id="band-endfade-mid" x1="380" y1="0" x2="866" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".10" stop-color="white" stop-opacity=".86"/>
      <stop offset=".22" stop-color="white"/>
      <stop offset=".78" stop-color="white"/>
      <stop offset=".90" stop-color="white" stop-opacity=".86"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band-endfade-low" x1="485" y1="0" x2="761" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".17" stop-color="white"/>
      <stop offset=".83" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="band-mask-mid" maskUnits="userSpaceOnUse" x="370" y="880" width="510" height="94">
      <rect x="370" y="880" width="510" height="94" fill="url(#band-endfade-mid)"/>
    </mask>
    <mask id="band-mask-low" maskUnits="userSpaceOnUse" x="473" y="962" width="298" height="94">
      <rect x="473" y="962" width="298" height="94" fill="url(#band-endfade-low)"/>
    </mask>
    <filter id="sunset-haze" x="-30%" y="-150%" width="160%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="sunset-soft" x="-15%" y="-100%" width="130%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="crystal-lower" clipPathUnits="userSpaceOnUse">
      <path d="M260 815 L437 705 L620 815 L806 705 L985 815 L619 1103 Z"/>
    </clipPath>
    <clipPath id="crystal-bottom" clipPathUnits="userSpaceOnUse">
      <path d="M260 815 L985 815 L619 1103 Z"/>
    </clipPath>
  </defs>

  <!-- Top: geometric cut of the amethyst crescent, intentionally open at left. -->
  <path d="M624 116 L831 342 L805 456 L624 339 Z" fill="url(#cap-front)"/>
  <path d="M624 116 L985 342 L831 342 Z" fill="url(#cap-top)"/>
  <path d="M831 342 L985 342 L805 456 Z" fill="url(#cap-end)"/>
  <path d="M624 116 L985 342" stroke="#fbbaff" stroke-opacity=".43" stroke-width="2"/>

  <!-- Slim, dark cleft between the upper crystal and its vertical shank. -->
  <path d="M805 454 L984 341 L985 351 L807 463 Z" fill="url(#spine-seam)"/>
  <path d="M806 461 L984 351 L806 704 Z" fill="url(#spine-front)"/>
  <path d="M984 351 L985 813 L806 704 Z" fill="url(#spine-edge)"/>
  <path d="M984 351 L985 812" stroke="#b951e5" stroke-width="2" stroke-opacity=".64"/>
  <path d="M806 461 L806 704" stroke="#c352d4" stroke-width="1.2" stroke-opacity=".47"/>
  <path d="M805 704 L985 815 L976 811 L804 710 Z" fill="#43144c" fill-opacity=".82"/>
  <path d="M807 707 L985 815" stroke="#da71f2" stroke-width="1.7" stroke-opacity=".42"/>

  <!-- Two upper, separate shoulders preserve the original unpainted moon void. -->
  <path d="M260 815 L437 705 L620 815 Z" fill="url(#left-top)"/>
  <path d="M437 705 L620 815 L484 815 Z" fill="url(#left-cut)" opacity=".74"/>
  <path d="M620 815 L806 705 L985 815 Z" fill="url(#right-top)"/>
  <path d="M620 815 L806 705 L769 815 Z" fill="url(#right-cut)" opacity=".68"/>
  <path d="M437 705 L620 815 M806 705 L985 815" stroke="#e18cff" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- Central inverted faceted cut. All lighting below is clipped to it. -->
  <path d="M260 815 L620 815 L619 1103 Z" fill="url(#base-left)"/>
  <path d="M620 815 L985 815 L619 1103 Z" fill="url(#base-right)"/>
  <path d="M260 815 L389 865 L619 1103" stroke="#bd50c8" stroke-opacity=".25" stroke-width="1.5"/>
  <path d="M985 815 L853 865 L619 1103" stroke="#d465dc" stroke-opacity=".25" stroke-width="1.5"/>

  <g clip-path="url(#crystal-lower)">
    <!-- Broad reflected light that appears trapped inside the gem, not outside it. -->
    <g filter="url(#sunset-haze)" opacity=".68">
      <path d="M251 804 L995 804 L995 863 L251 863 Z" fill="#ff9953"/>
      <path d="M371 900 L863 900 L870 945 L364 945 Z" fill="#ffa25a"/>
      <path d="M479 983 L760 983 L755 1028 L481 1028 Z" fill="#ffb16e"/>
    </g>
    <!-- Three substantial twilight bands rather than thin neon wires. -->
    <path d="M248 798 H999 V875 H248 Z" fill="url(#amber-broad)"/>
    <path d="M380 890 H862 L822 963 H418 Z" fill="url(#amber-mid)" mask="url(#band-mask-mid)"/>
    <path d="M485 971 H760 L721 1047 H524 Z" fill="url(#amber-bottom)" mask="url(#band-mask-low)"/>
    <g filter="url(#sunset-soft)" opacity=".92">
      <path d="M260 814 H985 V824 H260 Z" fill="#ffbd76"/>
      <path d="M402 906 H840 V917 H402 Z" fill="#ffc985" mask="url(#band-mask-mid)"/>
      <path d="M491 986 H748 V999 H491 Z" fill="#ffcd8a" mask="url(#band-mask-low)"/>
    </g>
    <!-- Narrowest brightest cores are softened by layered wide ambient light. -->
    <path d="M260 813 H985 V820 H260 Z" fill="url(#sunset-highlight)" opacity=".89"/>
    <path d="M401 907 H843 V912 H401 Z" fill="url(#sunset-highlight)" opacity=".72" mask="url(#band-mask-mid)"/>
    <path d="M490 987 H748 V992 H490 Z" fill="url(#sunset-highlight)" opacity=".72" mask="url(#band-mask-low)"/>
  </g>

  <!-- A thin polished center ridge is cut from the original facets. -->
  <path d="M612 815 L627 815 L622 1089 L619 1103 L616 1089 Z" fill="url(#center-ridge)" opacity=".83"/>
  <path d="M617 1050 L619 1103 L621 1050 Z" fill="url(#base-tip)"/>
  <path d="M260 815 L619 1103 L985 815" stroke="#a83dc7" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round"/>
</svg>