# CANDIDATE ONLY: no live Traefik configuration changes on merge.
# Administrator: set a strong setupPassword in private Noctite config,
# restart the app, verify initial admin protection and dev domain/TLS before
# installing this file into Traefik's dynamic configuration directory.
http:
  routers:
    noctite-dev:
      rule: Host(`noctite-dev.manafield.studio`)
      entryPoints:
        - websecure
      service: noctite-dev
      tls: {}
  services:
    noctite-dev:
      loadBalancer:
        servers:
          - url: http://noctite-dev:3000
