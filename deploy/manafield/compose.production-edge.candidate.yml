# ADDITIVE production override candidate; never run against existing dev volumes.
# Requires operator-reviewed Noctite image, production-only DB/media and
# .config/default.yml set to https://noctite.manafield.studio/ before startup.
name: noctite-prod

services:
  noctite:
    networks:
      manafield_edge:
        aliases:
          - noctite-prod

networks:
  # Override the dev adapter network from the base Compose file. This
  # name must be verified by the administrator against the active Instance.
  manafield_modules:
    name: manafield-modules
    external: true
  # Only Noctite (NOT database / Redis) joins the shared ingress network.
  manafield_edge:
    name: manafield-edge
    external: true
