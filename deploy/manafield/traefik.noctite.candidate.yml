# CANDIDATE ONLY. Requires production Noctite actually running on
# the shared manafield-edge network, valid TLS, verified DNS/Cloudflare rules,
# moderator/backup review and administrator-approved installation.
#
# Do not place this file in the live Traefik dynamic directory until
# readiness and stable ActivityPub domain have been confirmed.
http:
  routers:
    noctite-social:
      rule: Host(`noctite.manafield.studio`)
      entryPoints:
        - websecure
      service: noctite-social
      tls: {}
  services:
    noctite-social:
      loadBalancer:
        servers:
          - url: http://noctite-prod:3000
