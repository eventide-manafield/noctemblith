# Optional HTTPS ingress overlay for the already-running isolated dev stack.
# Not used unless an administrator explicitly selects BOTH Compose files.
# The project must remain noctite-dev to reuse only the existing dev DB/media.
name: noctite-dev

services:
  noctite:
    networks:
      manafield_edge:
        aliases:
          - noctite-dev

networks:
  manafield_edge:
    name: manafield-edge
    external: true
